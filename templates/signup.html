<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Restaurant Sign Up</h1>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<p style="color:red">{{ m }}</p>{% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST">
    <input type="text" name="name" placeholder="Restaurant Name" required><br>
    <input type="email" name="email" placeholder="Email" required><br>
    <input type="password" name="password" placeholder="Password" required><br>

    <!-- ← checkbox inside the form, before the button -->
    <label>
      <input type="checkbox" name="agree_terms" required>
      I agree to the <a href="/terms" target="_blank">Terms of Service</a>
    </label><br><br>

    <button type="submit">Sign Up</button>
  </form>

  <p>Already have an account? <a href="/login">Log in</a></p>

  <!-- ← footer inside <body> before </body> -->
  <p style="font-size:12px; color:#999; text-align:center; margin-top:40px;">
    © 2026 All Rights Reserved | <a href="/terms">Terms of Service</a>
  </p>

</body>
</html>
