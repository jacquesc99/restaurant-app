{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
  <h1>Login</h1>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<p style="color:red">{{ m }}</p>{% endfor %}
    {% endif %}
  {% endwith %}

  <div class="card">
    <form method="POST">
        <input type="email" name="email" placeholder="Email" required>

        <div style="position:relative; width:100%;">
            <input type="password" name="password" id="password" placeholder="Password" required style="padding-right:40px;">
            <span onclick="togglePassword()" style="position:absolute; right:12px; top:50%; transform:translateY(-60%); cursor:pointer; font-size:18px;">👁</span>
        </div>

        <button type="submit">Login</button>
    </form>
  </div>

  <p>Don't have an account? <a href="/signup">Sign up</a></p>
  <p><a href="/reset-password">Forgot password?</a></p>

  <script>
    function togglePassword() {
        const input = document.getElementById('password');
        input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>
{% endblock %}
