<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ambrogio PB Allergen & Dietary Filter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #fafafa;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            margin: 6px;
            border: 1px solid #ddd;
            border-radius: 999px;
            background-color: #2d6cdf;
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.2s;
        }

        .pill:hover {
            background-color: #1f4fbf;
        }
    </style>
</head>

<body>
  <h1>Restaurant Allergen Filter</h1>
  <p>Manage your menu's allergen and dietary information.</p>

  <a class="pill" href="/signup">Sign Up</a>
  <a class="pill" href="/login">Login</a>
</body>
</html>
